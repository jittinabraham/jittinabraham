name: Bouncing Ball Animation

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC
  workflow_dispatch:      # Manual trigger
  push:
    branches:
      - main             # Runs on push to main

jobs:
  generate-ball:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate bouncing ball SVG
        run: |
          echo '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
            <style>
              @keyframes bounce {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-50px); }
              }
              .ball { animation: bounce 1s infinite; fill: #ff0000; }
            </style>
            <circle class="ball" cx="50" cy="50" r="20"/>
          </svg>' > ball_animation.svg

      - name: Update README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update bouncing ball animation"
          file_pattern: "ball_animation.svg"
